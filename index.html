<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Leiturize - Demo | Encontre sua próxima leitura!</title>

    <script src="https://kit.fontawesome.com/68c1bf20ab.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <img src="./assets/leiturize-logoSombreada.svg" alt="Logo Leiturize">
        <h1>Leiturize</h1>
        <nav>
            <ul>
                <li><a href="#discover">Descubra</a></li>
                <li><a href="#">Cadastre um livro</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="main-info">
            <h2>Explore!</h2>
            <h3>Leia a sinopse, descubra o livro e encontre sua próxima aventura.</h3>
        </div>
        <section id="discover">
            <article class="livro">
                <p class="sinopse" id="sinopseCurta"></p>
                <div class="btns">
                    <button class="btn-principal" onclick="discoverBook()">
                        <i class="fa-solid fa-magnifying-glass" style="color: #1b1a1a;"></i>
                        Descubra o livro
                    </button>
                    <button class="btn" onclick="showBook()">
                        Próxima recomendação
                        <i class="fa-solid fa-arrow-right" style="color: #1b1a1a;"></i>
                    </button>
                </div>
            </article>
            <article class="apresentaLivro hidden" id="apresentaLivro">
                <div class="apresentaLivro-header">
                    <div class="titulo">
                        <h2 class="titulo" id="titulo"></h2>
                        <h3 class="subtitulo" id="subtitulo"></h3>
                    </div>
                    <i class="fa-solid fa-x" style="color: #1b1a1a;"></i>
                </div>
                <span class="divisor"></span>
                <h4 class="autor" id="autor"></h4>
                <p class="ano" id="ano"></p>
                <p class="genero" id="genero"></p>
                <p class="classificacao" id="classificacao"></p>
                <p class="sinopseLonga" id="sinopseLonga"></p>
            </article>
        </section>
    </main>
    <footer>
        <p>Desenvolvidor por <a href="#">Helen Brandão</a> 2016</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
